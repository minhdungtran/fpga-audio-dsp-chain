name: rtl/verification tests

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps: 
      - name: check the repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: pip install -r requirement.txt

      - name: Install Verilator build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl make autoconf g++ flex bison ccache libfl2 libfl-dev zlib1g zlib1g-dev

      - name: Install Verilator 5.052
        run: |
          git clone --depth 1 --branch v5.052 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure
          make -j2
          sudo make install
        
      - name: Run lint and tests
        run: make all

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          path: |
            tb/**/results.xml
            tb/**/sim_build/**
          if-no-files-found: ignore